<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up</title>
</head>
<body>

    <form action="/app/createUser" method="POST">

        <label for="user_name">Username:

        </label>
        <input id="user_name" type="text" name="user_name" placeholder="Enter your username">

        <label for="email">Email:

        </label>
        <input id="email" type="email" name="email" placeholder="Enter your email">

        <label for="password">Password:

        </label>
        <input id="password" type="password" name="password" placeholder="Enter your password">

        <br>
        <input type="radio" id="student" name="is_student" value="1" checked>
        <label for="student">Student

        </label>
        <br>
        <input type="radio" id="instructor" name="is_student" value="0">
        <label for="instructor">Instructor
            
        </label>
        <br>

        <button type="submit">Sign Up</button>

    </form>

</body>
</html>
