<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up</title>
</head>
<body>

    <form action="/app/createUser" method="POST">

        <label for="user_name">Username:</label>
        <input type="text" id="user_name" name="user_name" placeholder="Enter your username">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">

        <br>

        <input type="radio" id="student" name="is_student" value="student" checked>
        <label for="student">Student</label>

        <br>

        <input type="radio" id="instructor" name="is_student" value="instructor">
        <label for="instructor">Instructor</label>

        <br>

        <button type="submit">Sign Up</button>

    </form>

</body>
</html>
