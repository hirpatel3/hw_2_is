<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .bio { max-width: 600px; margin: 0 auto; }
        .username { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
<div class="bio">
    <h1>AttendanceChimp</h1>
    <p>Electronic class attendance tracking application. Allows for an easy way to check attendance of students.</p>
    <hr>

    <p>     
        User:
        <span class="username">
            {% if user.is_authenticated %}
                {{ user.username }}
            {% else %}
                Not logged in.
            {% endif %}

            <p>Current time: {{ time_view }} CST</p>
        </span>
    </p>
    

</div>
</body>
</html>
